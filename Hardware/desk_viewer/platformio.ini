; Vox desk viewer: ESP32 dev module, 128x64 OLED, TTP223 touch sensor.
; Reads alarms, reminders and tasks straight from Supabase over Wi-Fi.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    adafruit/Adafruit GFX Library@^1.12.0
    adafruit/Adafruit SSD1306@^2.5.13
    bblanchon/ArduinoJson@^7.2.0
