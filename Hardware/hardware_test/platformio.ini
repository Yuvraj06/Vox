; Test firmware for the Vox keychain parts: OLED, button and INMP441 mic.
; The official PlatformIO platform has no Arduino support for the ESP32-C6,
; so this uses the pioarduino build of the same platform.

[env:xiao_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit GFX Library@^1.12.0
    adafruit/Adafruit SSD1306@^2.5.13
